name: Build DevBuild
on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
    workflow_dispatch:

concurrency:
    group: devbuild
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write
    attestations: write

env:
    FORCE_COLOR: true

jobs:
    Build:
        runs-on: windows-latest
        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

            - name: Use Node.js 26.7.0
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 26.7.0
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm testTsc

            - name: Write changelog
              run: |
                  previous=$(gh release view devbuild --json name -q .name 2>/dev/null || true)
                  previous=${previous##* }
                  if [ -z "$previous" ] || ! git cat-file -e "$previous^{commit}" 2>/dev/null; then previous=$(git describe --tags --abbrev=0 2>/dev/null || true); fi
                  if [ -n "$previous" ]; then git log -n 50 --format='%B' "$previous..HEAD" | cat -s > "$RUNNER_TEMP/notes.md"; fi
                  if [ ! -s "$RUNNER_TEMP/notes.md" ]; then git log -1 --format='%B' > "$RUNNER_TEMP/notes.md"; fi
                  cat "$RUNNER_TEMP/notes.md"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build web
              run: pnpm buildWeb

            - name: Build and sign
              run: |
                  [ -n "$SIGNING_KEY" ] || { echo "The VACKLE_SIGNING_KEY secret is missing"; exit 1; }
                  trap 'rm -f "$VACKLE_SIGNING_KEY"' EXIT
                  printf '%s\n' "$SIGNING_KEY" > "$VACKLE_SIGNING_KEY"
                  pnpm build
              env:
                  SIGNING_KEY: ${{ secrets.VACKLE_SIGNING_KEY }}
                  VACKLE_SIGNING_KEY: ${{ runner.temp }}/signing-key.pem
                  VACKLE_NOTES_FILE: ${{ runner.temp }}/notes.md

            - name: Attest build provenance
              if: github.repository == 'sinincali/vackle'
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
              with:
                  subject-path: |
                      dist/Vackle.exe
                      dist/injector.cjs
                      dist/renderer.js
                      dist/extension.zip
                      dist/Vackle.user.js
                      dist/vackle-release.json

            - name: Upload DevBuild as release
              if: github.repository == 'sinincali/vackle'
              run: |
                  gh release view devbuild > /dev/null 2>&1 || gh release create devbuild --target "$GITHUB_SHA" --title "DevBuild" --notes "Built automatically from main." --latest
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/devbuild" -f sha="$GITHUB_SHA" -F force=true > /dev/null
                  gh release upload devbuild --clobber dist/Vackle.exe dist/injector.cjs dist/renderer.js dist/extension.zip dist/Vackle.user.js dist/Vackle.meta.js
                  gh release upload devbuild --clobber dist/vackle-release.json
                  gh release edit devbuild --title "DevBuild $(git rev-parse --short HEAD)" --notes-file "$RUNNER_TEMP/notes.md" --latest
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
